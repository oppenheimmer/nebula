# Development checks run offline. The application fetches text only on URL paste.
name: checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Build the development image
        run: ./scripts/dev.sh build-image
      - name: C++ formatting
        run: ./scripts/dev.sh format --check
      - name: GCC
        run: ./scripts/dev.sh test gcc
      - name: Clang
        run: ./scripts/dev.sh test clang
      - name: Core without Qt or SQLite
        run: ./scripts/dev.sh test core
      - name: AddressSanitizer and UndefinedBehaviorSanitizer
        run: ./scripts/dev.sh test asan
      - name: Coverage-guided parser fuzzing
        run: ./scripts/dev.sh fuzz 5
      - name: Debian package and offline runtime checks
        run: ./scripts/package-check.sh
      - name: Repeat interaction suites (BUG-014, BUG-015)
        run: ./scripts/dev.sh stress 10
