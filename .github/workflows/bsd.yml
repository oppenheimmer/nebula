# Synthetic fixtures only. Native desktop/package acceptance is tracked separately.
name: BSD native checks
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - run: ./scripts/dev.sh build-image
      - run: ./scripts/dev.sh portability bundle
      - uses: actions/upload-artifact@v4
        with:
          name: portability-linux
          path: build-container-portability/portability-output
          include-hidden-files: true
          retention-days: 1
  native:
    strategy:
      fail-fast: false
      matrix:
        system: [freebsd, openbsd]
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - if: matrix.system == 'freebsd'
        uses: vmactions/freebsd-vm@c46abacb49f09938ca4e1702d15d836285d694cc # v1
        with:
          release: '14.5'
          arch: x86_64
          mem: 6144
          cpu: 2
          cache-after-prepare: true
          prepare: |
            pkg install -y cmake ninja qt6-base sqlite3 bash
            pw useradd nebula -m -s /bin/sh
          run: |
            route -n delete default
            route -n delete -inet6 default 2>/dev/null || true
            netstat -rn
            chown -R nebula "$GITHUB_WORKSPACE"
            su -m nebula -c 'sh scripts/bsd-check.sh'
      - if: matrix.system == 'openbsd'
        uses: vmactions/openbsd-vm@f1ca8bc8ecc5b6ef7218e5b914836e067e1546d3 # v1
        with:
          release: '8.0'
          arch: x86_64
          mem: 6144
          cpu: 2
          cache-after-prepare: true
          prepare: |
            pkg_add -I cmake ninja qt6-qtbase sqlite3 bash
            useradd -m -s /bin/sh nebula
          run: |
            route -n delete default
            route -n delete -inet6 default 2>/dev/null || true
            netstat -rn
            chown -R nebula "$GITHUB_WORKSPACE"
            su -m nebula -c 'sh scripts/bsd-check.sh'
      - uses: actions/upload-artifact@v4
        with:
          name: portability-${{ matrix.system }}
          path: build-bsd/portability-output
          include-hidden-files: true
          retention-days: 1
  transfers:
    needs: [linux, native]
    strategy:
      fail-fast: false
      matrix:
        system: [linux, freebsd, openbsd]
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          pattern: portability-*
          path: build-portability-inputs
      - if: matrix.system == 'linux'
        run: ./scripts/dev.sh build-image && ./scripts/dev.sh portability verify
      - if: matrix.system == 'freebsd'
        uses: vmactions/freebsd-vm@c46abacb49f09938ca4e1702d15d836285d694cc # v1
        with:
          release: '14.5'
          arch: x86_64
          mem: 6144
          cpu: 2
          copyback: false
          cache-after-prepare: true
          prepare: |
            pkg install -y cmake ninja qt6-base sqlite3 bash
            pw useradd nebula -m -s /bin/sh
          run: |
            route -n delete default
            route -n delete -inet6 default 2>/dev/null || true
            netstat -rn
            chown -R nebula "$GITHUB_WORKSPACE"
            su -m nebula -c 'sh scripts/bsd-check.sh transfer'
      - if: matrix.system == 'openbsd'
        uses: vmactions/openbsd-vm@f1ca8bc8ecc5b6ef7218e5b914836e067e1546d3 # v1
        with:
          release: '8.0'
          arch: x86_64
          mem: 6144
          cpu: 2
          copyback: false
          cache-after-prepare: true
          prepare: |
            pkg_add -I cmake ninja qt6-qtbase sqlite3 bash
            useradd -m -s /bin/sh nebula
          run: |
            route -n delete default
            route -n delete -inet6 default 2>/dev/null || true
            netstat -rn
            chown -R nebula "$GITHUB_WORKSPACE"
            su -m nebula -c 'sh scripts/bsd-check.sh transfer'
